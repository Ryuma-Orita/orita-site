{{/*
  一覧・詳細・本文のスタイル。

  Blowfish は Tailwind の preflight で見出し・リスト等の既定スタイルを
  すべて消すため、本文の体裁はここで自前に組み立てている。
  色はハードコードせず currentColor から導出しているので、
  ライト/ダーク両対応、かつテーマを替えてもそのまま動く。
*/}}
{{ if not (.Scratch.Get "orita-styles-done") }}
{{ .Scratch.Set "orita-styles-done" true }}
<style>
.orita { --muted: color-mix(in oklab, currentColor 58%, transparent);
         --rule:  color-mix(in oklab, currentColor 14%, transparent);
         --chip:  color-mix(in oklab, currentColor 9%, transparent); }

.orita > h1 { font-size: 1.85rem; font-weight: 700; line-height: 1.35;
              margin: 0 0 1.75rem; letter-spacing: -0.01em; }

/* ============ 本文（Markdown から生成される部分） ============ */
.orita-prose { line-height: 1.8; }
.orita-prose > :first-child { margin-top: 0; }
.orita-prose > :last-child  { margin-bottom: 0; }

.orita-prose p { margin: 1.1rem 0; }

.orita-prose h2 { font-size: 1.3rem;  font-weight: 700; line-height: 1.4;
                  margin: 2.75rem 0 0.9rem; }
.orita-prose h3 { font-size: 1.1rem;  font-weight: 700; line-height: 1.45;
                  margin: 2.25rem 0 0.75rem;
                  padding-bottom: 0.4rem; border-bottom: 1px solid var(--rule); }
.orita-prose h4 { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.08em;
                  text-transform: uppercase; color: var(--muted);
                  margin: 1.6rem 0 0.4rem; }
.orita-prose h5, .orita-prose h6 { font-size: 0.95rem; font-weight: 700; margin: 1.2rem 0 0.4rem; }

.orita-prose ul, .orita-prose ol { margin: 0.9rem 0; padding-left: 1.5rem; }
.orita-prose ul { list-style: disc; }
.orita-prose ol { list-style: decimal; }
.orita-prose li { margin: 0.4rem 0; padding-left: 0.15rem; }
.orita-prose li::marker { color: var(--muted); }
.orita-prose li > ul, .orita-prose li > ol { margin: 0.4rem 0; }

.orita-prose a { text-decoration: underline; text-underline-offset: 0.18em;
                 text-decoration-thickness: 1px;
                 text-decoration-color: color-mix(in oklab, currentColor 40%, transparent); }
.orita-prose a:hover { text-decoration-color: currentColor; }

.orita-prose strong { font-weight: 700; }

.orita-prose hr { border: 0; border-top: 1px solid var(--rule); margin: 2.75rem 0; }

.orita-prose blockquote { margin: 1.4rem 0; padding: 0.15rem 0 0.15rem 1.1rem;
                          border-left: 3px solid var(--rule); color: var(--muted); }
.orita-prose blockquote p { margin: 0.5rem 0; }

.orita-prose table { width: 100%; border-collapse: collapse; margin: 1.2rem 0;
                     font-size: 0.94rem; }
.orita-prose th, .orita-prose td { text-align: left; padding: 0.5rem 1rem 0.5rem 0;
                                   border-bottom: 1px solid var(--rule); vertical-align: top; }
.orita-prose th { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em;
                  text-transform: uppercase; color: var(--muted); }

.orita-prose code { font-size: 0.9em; padding: 0.1rem 0.35rem; border-radius: 4px;
                    background: var(--chip); }
.orita-prose pre { overflow-x: auto; padding: 0.9rem 1.1rem; border-radius: 6px;
                   background: var(--chip); margin: 1.2rem 0; }
.orita-prose pre code { padding: 0; background: none; }

.orita-prose img { max-width: 100%; height: auto; }

/* ============ 年をハンギングマーカーにした一覧 ============ */
.orita-group { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0 1.5rem;
               padding-block: 1.25rem; border-top: 1px solid var(--rule); }
.orita-group:first-of-type { border-top: none; }

.orita-year { margin: 0; font-size: 0.95rem; font-weight: 700; line-height: 1.9;
              font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
              color: var(--muted); position: sticky; top: 1rem; align-self: start; }

.orita-items { margin: 0; padding: 0; list-style: none; }
.orita-item + .orita-item { margin-top: 1.5rem; }

.orita-item-title { margin: 0 0 0.3rem; font-size: 1.05rem; line-height: 1.5; font-weight: 700; }
.orita-item-title a { text-decoration: none; }
.orita-item-title a:hover { text-decoration: underline; text-underline-offset: 0.18em; }

.orita-authors { margin: 0 0 0.2rem; font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
.orita-cite    { margin: 0; font-size: 0.9rem; line-height: 1.6; }
.orita-meta    { margin: 0.15rem 0 0; font-size: 0.88rem; color: var(--muted); }

.orita-chip { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px;
              background: var(--chip); font-size: 0.72rem; font-weight: 700;
              letter-spacing: 0.03em; vertical-align: 0.12em; margin-left: 0.4rem;
              white-space: nowrap; }

.orita-links { margin: 0.45rem 0 0; padding: 0; list-style: none;
               display: flex; flex-wrap: wrap; gap: 0.4rem; }
.orita-links a { display: inline-block; padding: 0.12rem 0.6rem; border-radius: 999px;
                 border: 1px solid var(--rule); font-size: 0.8rem; text-decoration: none; }
.orita-links a:hover { background: var(--chip); }

/* ============ 詳細ページ ============ */
.orita-single-meta { margin: 0 0 1.5rem; padding-bottom: 1.25rem;
                     border-bottom: 1px solid var(--rule); }
.orita-abstract { margin: 1.5rem 0 2rem; }
.orita-abstract h2 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.09em;
                     text-transform: uppercase; color: var(--muted); margin: 0 0 0.5rem; }
.orita-abstract p { margin: 0; line-height: 1.8; }

/* ============ トップページ ============ */
.orita-home { text-align: center; padding-block: 2rem 0.5rem; }
.orita-avatar { width: 160px; height: 160px; border-radius: 50%;
                margin: 0 auto 1.25rem; display: block; }
.orita-home-name { font-size: 2rem; font-weight: 700; margin: 0 0 0.35rem; }
.orita-home-headline { margin: 0 0 1rem; color: var(--muted); font-size: 1.02rem; }
.orita-home-links { justify-content: center; }
.orita-home-body { padding-block: 1.5rem 2rem; }

@media (max-width: 640px) {
  .orita-group { grid-template-columns: 1fr; gap: 0.5rem; padding-block: 1rem; }
  .orita-year { position: static; line-height: 1.3; }
  .orita > h1 { font-size: 1.5rem; }
}
</style>
{{ end }}
