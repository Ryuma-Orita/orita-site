# ============================================================
#  テーマ (Blowfish) の見た目・機能の設定
#  好みに応じて値を変えて構いません。
# ============================================================

# 配色。他の候補: ocean, forest, avocado, noir, one-light, slate,
#                congo, fire, autumn, github, terminal
colorScheme = "forest"

# 閲覧者の端末（OS）のライト/ダーク設定に自動で合わせる。
# 端末が判定できない場合は defaultAppearance が使われる。
# どちらの場合も、右上のボタンで手動切り替えは可能。
defaultAppearance = "dark"
autoSwitchAppearance = true

# プロフィール写真などをクリックしても拡大しないようにする
disableImageZoom = true

enableSearch = true
# 画像を Hugo に最適化させる（表示サイズに合わせて縮小・WebP化）。
# ※ homepage.layout = "background" で SVG を背景に使う場合は true にすること。
disableImageOptimization = false
enableCodeCopy = false
mainSections = ["publication", "talk"]
defaultSocialImage = "img/ogp.png"  # 共有時のプレビュー画像

[header]
  # スクロールしても上部に残るヘッダー。
  # blur 付き（fixed-fill-blur）にすると半透明になり背景を透かすため、
  # 背景に色の強い形を置いている今の構成では上部だけ色が濁る。
  # 不透明の fixed-fill にして、8配色すべてで上部を安定させる。
  layout = "fixed-fill"

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true  # ライト/ダーク切り替えボタン
  showScrollToTop = true

# --- トップページ（写真・肩書・リンク・本文）---
# 背景は配色ごとに custom.css と extend-head.html が用意するので、
# テーマのトップページ専用背景（layout = "background"）は使わない。
[homepage]
  layout = "profile"
  showRecent = false

# --- 個別ページ ---
[article]
  showDate = true
  showDateUpdated = false
  showAuthor = false
  showBreadcrumbs = true         # 「ホーム > 論文 > ...」のパンくず
  showDraftLabel = false
  showEdit = false
  showHeadingAnchors = true
  showPagination = true          # 前後の記事への移動
  showReadingTime = false        # 書誌ページには不要
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  showComments = false
  showZenMode = false
  sharingLinks = false
  showRelatedContent = false

# --- 一覧ページ ---
[list]
  showBreadcrumbs = false
  showSummary = true             # ★ 著者名・掲載誌・会場をここに出す
  showCards = false
  groupByYear = true             # ★ 年ごとにまとめる
  constrainItemsWidth = true
  showTableOfContents = false
