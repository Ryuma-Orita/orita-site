# ============================================================
#  テーマ (Blowfish) の見た目・機能の設定
#  好みに応じて値を変えて構いません。
# ============================================================

# 配色。他の候補: ocean, forest, avocado, noir, one-light, slate,
#                congo, fire, autumn, github, terminal
colorScheme = "forest"

defaultAppearance = "light"      # 既定はライト。dark にすると既定がダーク
autoSwitchAppearance = true      # OSの設定に自動追従

enableSearch = true
disableImageOptimization = true  # SVGをそのまま使うために必要
enableCodeCopy = false
mainSections = ["publication", "talk"]
defaultSocialImage = "img/ogp.png"  # 共有時のプレビュー画像

[header]
  layout = "fixed-fill-blur"     # スクロールしても上部に残るヘッダー

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true  # ライト/ダーク切り替えボタン
  showScrollToTop = true

# --- トップページ（写真・肩書・リンク・本文）---
# 背景はサイト全体で1枚（assets/css/custom.css）にしているので、
# トップページ専用の背景画像は使わない。
# 使いたくなったら以下の3行のコメントを外し、custom.css の body::before を消すこと。
[homepage]
  layout = "profile"
  # layout = "background"
  # homepageImage = "img/background.svg"
  # layoutBackgroundBlur = true
  showRecent = false

# --- 個別ページ ---
[article]
  showDate = true
  showDateUpdated = false
  showAuthor = false
  showBreadcrumbs = true         # 「ホーム > 論文 > ...」のパンくず
  showDraftLabel = false
  showEdit = false
  showHeadingAnchors = true
  showPagination = true          # 前後の記事への移動
  showReadingTime = false        # 書誌ページには不要
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  showComments = false
  showZenMode = false
  sharingLinks = false
  showRelatedContent = false

# --- 一覧ページ ---
[list]
  showBreadcrumbs = false
  showSummary = true             # ★ 著者名・掲載誌・会場をここに出す
  showCards = false
  groupByYear = true             # ★ 年ごとにまとめる
  constrainItemsWidth = true
  showTableOfContents = false
