# ============================================================
#  Markdown と数式の設定
#  abstract に $...$ で数式が入っているので passthrough が必須
# ============================================================

[goldmark.renderer]
  unsafe = true

[goldmark.extensions.passthrough]
  enable = true
  [goldmark.extensions.passthrough.delimiters]
    block  = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 3
