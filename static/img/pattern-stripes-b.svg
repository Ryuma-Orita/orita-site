<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
    <!-- stripes を2層に分けたうちの手前（速い）。
       規則正しい縞なので「1本おき」に分ける。こうすると
       各層それ自体が等間隔の縞になり、2枚が擦れ違って奥行きが出る。
       継ぎ目をまたぐ図形の複製は必ず同じ層に入れてある。 -->
  <g stroke="#fff" fill="none">
    <line x1="-1440" y1="-1440" x2="720" y2="720" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="-1200" y1="-1440" x2="960" y2="720" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="-1440" y1="-720" x2="720" y2="1440" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="-1200" y1="-720" x2="960" y2="1440" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="-1440" y1="0" x2="720" y2="2160" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="-1200" y1="0" x2="960" y2="2160" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="-480" y1="-1440" x2="1680" y2="720" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="-480" y1="-720" x2="1680" y2="1440" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="-480" y1="0" x2="1680" y2="2160" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="240" y1="-1440" x2="2400" y2="720" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="240" y1="-720" x2="2400" y2="1440" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="240" y1="0" x2="2400" y2="2160" stroke-width="44" stroke-opacity="0.36"/>
    <line x1="-720" y1="-1440" x2="1440" y2="720" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="-720" y1="-720" x2="1440" y2="1440" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="-720" y1="0" x2="1440" y2="2160" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="0" y1="-1440" x2="2160" y2="720" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="0" y1="-720" x2="2160" y2="1440" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="0" y1="0" x2="2160" y2="2160" stroke-width="54" stroke-opacity="0.42"/>
    <line x1="-960" y1="-1440" x2="1200" y2="720" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="-960" y1="-720" x2="1200" y2="1440" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="-960" y1="0" x2="1200" y2="2160" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="-240" y1="-1440" x2="1920" y2="720" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="-240" y1="-720" x2="1920" y2="1440" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="-240" y1="0" x2="1920" y2="2160" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="480" y1="-1440" x2="2640" y2="720" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="480" y1="-720" x2="2640" y2="1440" stroke-width="60" stroke-opacity="0.46"/>
    <line x1="480" y1="0" x2="2640" y2="2160" stroke-width="60" stroke-opacity="0.46"/>
  </g>
</svg>
