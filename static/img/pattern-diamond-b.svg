<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <!-- diamond（菱形の斜め格子）を2層に分けたうちの手前（太い・速い・大きい）。
       傾き±2の直線2組が交差して 60×120 の縦長の菱を作る。
       切片は120刻み（720を割り切るので継ぎ目が合う）。
       太い3本／細い3本を交互に分けたので、各層それ自体が
       完全な菱格子になる。継ぎ目をまたぐ複製は同じ層に入れてある。 -->
  <g stroke="#fff" fill="none">
    <line x1="-400" y1="-2240" x2="1120" y2="800" stroke-width="16" stroke-opacity="0.72"/>
    <line x1="-400" y1="-2000" x2="1120" y2="1040" stroke-width="14" stroke-opacity="0.62"/>
    <line x1="-400" y1="-1760" x2="1120" y2="1280" stroke-width="19" stroke-opacity="0.8"/>
    <line x1="-400" y1="-1520" x2="1120" y2="1520" stroke-width="16" stroke-opacity="0.72"/>
    <line x1="-400" y1="-1280" x2="1120" y2="1760" stroke-width="14" stroke-opacity="0.62"/>
    <line x1="-400" y1="-1040" x2="1120" y2="2000" stroke-width="19" stroke-opacity="0.8"/>
    <line x1="-400" y1="-800" x2="1120" y2="2240" stroke-width="16" stroke-opacity="0.72"/>
    <line x1="-400" y1="-560" x2="1120" y2="2480" stroke-width="14" stroke-opacity="0.62"/>
    <line x1="-400" y1="-320" x2="1120" y2="2720" stroke-width="19" stroke-opacity="0.8"/>
    <line x1="-400" y1="-80" x2="1120" y2="2960" stroke-width="16" stroke-opacity="0.72"/>
    <line x1="-400" y1="800" x2="1120" y2="-2240" stroke-width="17" stroke-opacity="0.76"/>
    <line x1="-400" y1="1040" x2="1120" y2="-2000" stroke-width="15" stroke-opacity="0.66"/>
    <line x1="-400" y1="1280" x2="1120" y2="-1760" stroke-width="12" stroke-opacity="0.58"/>
    <line x1="-400" y1="1520" x2="1120" y2="-1520" stroke-width="17" stroke-opacity="0.76"/>
    <line x1="-400" y1="1760" x2="1120" y2="-1280" stroke-width="15" stroke-opacity="0.66"/>
    <line x1="-400" y1="2000" x2="1120" y2="-1040" stroke-width="12" stroke-opacity="0.58"/>
    <line x1="-400" y1="2240" x2="1120" y2="-800" stroke-width="17" stroke-opacity="0.76"/>
    <line x1="-400" y1="2480" x2="1120" y2="-560" stroke-width="15" stroke-opacity="0.66"/>
    <line x1="-400" y1="2720" x2="1120" y2="-320" stroke-width="12" stroke-opacity="0.58"/>
    <line x1="-400" y1="2960" x2="1120" y2="-80" stroke-width="17" stroke-opacity="0.76"/>
  </g>
</svg>
