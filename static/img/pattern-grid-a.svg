<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
    <!-- grid を2層に分けたうちの奥（ゆっくり・小さく）。
       縦線と横線で分ける。規則正しい格子なので太さで分けると
       律動が乱れるが、向きで分ければ互いに干渉せず、
       縦線は左へ、横線は下へ流れて読みやすい。 -->
  <g>
    <line x1="0" y1="-720" x2="0" y2="1440" stroke="#fff" stroke-width="22" stroke-opacity="0.75"/>
    <line x1="120" y1="-720" x2="120" y2="1440" stroke="#fff" stroke-width="9" stroke-opacity="0.38"/>
    <line x1="240" y1="-720" x2="240" y2="1440" stroke="#fff" stroke-width="15" stroke-opacity="0.55"/>
    <line x1="360" y1="-720" x2="360" y2="1440" stroke="#fff" stroke-width="9" stroke-opacity="0.38"/>
    <line x1="600" y1="-720" x2="600" y2="1440" stroke="#fff" stroke-width="11" stroke-opacity="0.44"/>
    <line x1="480" y1="-720" x2="480" y2="1440" stroke="#fff" stroke-width="26" stroke-opacity="0.82"/>
  </g>
</svg>
