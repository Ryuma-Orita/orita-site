<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
    <!-- grid を2層に分けたうちの手前（太い・速い・大きい）。
       縦線・横線それぞれの太い半分を手前へ。こうすると
       両層とも「格子」の形を保ったまま、太さ・大きさ・速さ・濃さで
       前後に分かれる。向きで分けると同じ形が2つの速さで動かず、
       視差として読めない（110回目の失敗）。 -->
  <g>
    <line x1="0" y1="-720" x2="0" y2="1440" stroke="#fff" stroke-width="22" stroke-opacity="0.75"/>
    <line x1="240" y1="-720" x2="240" y2="1440" stroke="#fff" stroke-width="15" stroke-opacity="0.55"/>
    <line x1="480" y1="-720" x2="480" y2="1440" stroke="#fff" stroke-width="26" stroke-opacity="0.82"/>
    <line x1="-720" y1="120" x2="1440" y2="120" stroke="#fff" stroke-width="24" stroke-opacity="0.78"/>
    <line x1="-720" y1="360" x2="1440" y2="360" stroke="#fff" stroke-width="18" stroke-opacity="0.62"/>
    <line x1="-720" y1="600" x2="1440" y2="600" stroke="#fff" stroke-width="28" stroke-opacity="0.85"/>
  </g>
</svg>
